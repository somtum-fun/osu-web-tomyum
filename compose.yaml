x-env: &x-env
  APP_KEY: "${APP_KEY}"
  BEATMAPS_DIFFICULTY_CACHE_SERVER_URL: http://beatmap-difficulty-lookup-cache:8080
  BROADCAST_DRIVER: redis
  DB_CONNECTION_STRING: Server=db;Database=osu;Uid=osuweb;
  DB_HOST: db
  ES_HOST: http://elasticsearch:9200
  ES_SOLO_SCORES_HOST: http://elasticsearch:9200
  GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
  NOTIFICATION_REDIS_HOST: redis
  PASSPORT_PUBLIC_KEY: "${PASSPORT_PUBLIC_KEY:-}"
  REDIS_HOST: redis

x-web: &x-web
  build:
    dockerfile: Dockerfile.development
  init: true
  volumes:
    - .:/app
  environment:
    <<: *x-env

services:
  php:
    <<: *x-web
    command: ['octane', '--watch']
    deploy:
      restart_policy:
        condition: on-failure
    shm_size: '2gb' # for chromium

  php-dusk:
    <<: *x-web
    command: ['octane', '--watch']
    environment:
      <<: *x-env
      APP_ENV: dusk.local
      OCTANE_STATE_FILE: /tmp/octane-state.json

  assets:
    <<: *x-web
    command: ["${ASSETS_COMMAND:-watch}"]

  job:
    <<: *x-web
    command: ['job']

  # Runs the scheduled commands (rankings, cleanups, daily challenge, …); see app/Console/Kernel.php.
  scheduler:
    <<: *x-web
    command: ['schedule']

  testjs:
    <<: *x-web
    volumes:
      - .:/app
      - ./storage/testjs-assets:/app/public/assets
      - ./storage/testjs-builds:/app/resources/builds
    profiles: ['testjs']
    command: ['test', 'js']

  migrator:
    <<: *x-web
    command: ['migrate']
    depends_on:
      db:
        condition: service_healthy

  beatmap-difficulty-lookup-cache:
    image: pppy/osu-beatmap-difficulty-lookup-cache
    ports:
      - "${BEATMAPS_DIFFICULTY_CACHE_EXTERNAL_PORT:-127.0.0.1:5001}:8080"

  notification-server:
    image: pppy/osu-notification-server
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - .env:/app/.env
      - ./storage/oauth-public.key:/app/oauth-public.key
    environment:
      <<: *x-env
    ports:
      # used by GitHub Actions test
      - "${NOTIFICATION_EXTERNAL_PORT:-127.0.0.1:2345}:2345"

  notification-server-dusk:
    image: pppy/osu-notification-server
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - .env.dusk.local:/app/.env
      - ./storage/oauth-public.key:/app/oauth-public.key
    environment:
      <<: *x-env

  db:
    image: mysql:8.4
    volumes:
      - database:/var/lib/mysql
      - ./docker/development/db_user.sql:/docker-entrypoint-initdb.d/db_user.sql
    environment:
      <<: *x-env
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "${MYSQL_EXTERNAL_PORT:-127.0.0.1:3306}:3306"
    healthcheck:
      # important to use 127.0.0.1 instead of localhost as mysql starts twice.
      # the first time it listens on sockets but isn't actually ready
      # see https://github.com/docker-library/mysql/issues/663
      start_interval: 1s
      start_period: 60s
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      timeout: 60s

  redis:
    command: ['redis-server', '--save', '60', '1', '--loglevel', 'warning']
    image: redis:latest
    ports:
      - "${REDIS_EXTERNAL_PORT:-127.0.0.1:6379}:6379"
    healthcheck:
      start_interval: 1s
      start_period: 60s
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      timeout: 60s
    volumes:
      - redis:/data

  elasticsearch:
    # Version must be kept up to date with library defined in: composer.json
    image: elasticsearch:7.17.16
    ports:
      - "${ES_EXTERNAL_PORT:-127.0.0.1:9200}:9200"
    volumes:
      - elasticsearch:/usr/share/elasticsearch/data
    environment:
      action.auto_create_index: false
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms512m -Xmx512m" # less OOM on default settings.
      ingest.geoip.downloader.enabled: false
    healthcheck:
      start_interval: 1s
      start_period: 60s
      test: curl -s http://localhost:9200/_cluster/health?wait_for_status=yellow >/dev/null || exit 1
      timeout: 60s

  nginx:
    image: nginx:latest
    depends_on:
      - php
      - php-dusk
      - notification-server
      - notification-server-dusk
    volumes:
      - ./docker/development/nginx-default.conf:/etc/nginx/conf.d/default.conf
      - .:/app
    ports:
      - "${NGINX_PORT:-8080}:80"

  score-indexer:
    image: pppy/osu-elastic-indexer:master
    command: ["queue", "watch"]
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      <<: *x-env
      SCHEMA: "${SCHEMA:-1}"


  # ppy's score processor (lazer support, TomYum docs/lazer.md): pp, total pp, ranks and grade
  # counts from stable (TomYum's legacy rows) and lazer scores together.
  score-processor:
    image: pppy/osu-queue-score-statistics:latest
    command: ["queue", "watch"]
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      <<: *x-env
      DB_USER: osuweb
      DB_NAME: osu
      # TomYum's stable rows have no osu_scores_high counterpart to write pp to.
      WRITE_LEGACY_SCORE_PP: "0"
      # Maps' .osu files from TomYum (custom maps are only there); it fetches from osu.ppy.sh.
      BEATMAP_DOWNLOAD_PATH: http://server:8080/osu/{0}
      SHARED_INTEROP_DOMAIN: http://nginx
      SHARED_INTEROP_SECRET: "${SHARED_INTEROP_SECRET:-}"
      # Exactly "0" turns the build check off here (ppy's processor tests != "0").
      CLIENT_CHECK_VERSION: "0"

  # ppy's spectator server (TomYum docs/lazer.md): lazer's multiplayer, spectating, online
  # presence and replays. Caddy serves it as https://spectator.localtest.me.
  spectator:
    build:
      # TomYum's build of ppy's server: a checkout of sundeiii/tomyum-spectator next to this one.
      context: ${SPECTATOR_PATH:-../tomyum-spectator}
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      <<: *x-env
      DB_USER: osuweb
      SERVER_PORT: "80"
      # Empty = no error reports (ppy's release build insists on the variable).
      SENTRY_DSN: ""
      SAVE_REPLAYS: "true"
      REPLAYS_PATH: /replays
      SHARED_INTEROP_DOMAIN: http://nginx
      SHARED_INTEROP_SECRET: "${SHARED_INTEROP_SECRET:-}"
      BANCHO_BOT_USER_ID: "${BANCHO_BOT_USER_ID:-1}"
      CLIENT_CHECK_VERSION: "false"
    volumes:
      # Checks lazer's logins with the website's Passport key.
      - ./storage/oauth-public.key:/app/oauth-public.key:ro
      - ./public/uploads/replay:/replays
    ports:
      - "${SPECTATOR_PORT:-127.0.0.1:8190}:80"

  score-indexer-test:
    image: pppy/osu-elastic-indexer:master
    command: ["queue", "watch"]
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      <<: *x-env
      # match with .env.testing.example
      DB_CONNECTION_STRING: Server=db;Database=osu_test;Uid=osuweb;
      ES_INDEX_PREFIX: test_
      SCHEMA: test

volumes:
  database:
  elasticsearch:
  redis:
